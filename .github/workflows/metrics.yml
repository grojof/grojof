name: Metrics

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate metrics
        # v3.34 (latest, unmaintained) can crash in its final cosmetic
        # "Consumed API requests" summary when the startup GET /rate_limit
        # call fails transiently; the SVG is already committed by then.
        continue-on-error: true
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          # Ephemeral GITHUB_TOKEN (public data only). Falls back to METRICS_TOKEN
          # if a minimal read-only PAT is ever added. No PAT => nothing long-lived.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          template: classic
          # Kept light on purpose: header + activity stay well within the GraphQL
          # quota so the languages plugin has budget to render (heavier sections
          # like repositories/community exhausted it before).
          base: header, activity
          config_timezone: Europe/Madrid
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
