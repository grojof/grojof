<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Guillermo Rojo — Senior Odoo Engineer · Full-Stack Developer">
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:15px;white-space:pre}
.row{opacity:0;animation:in .6s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.cursor{animation:blink 1.1s steps(1) infinite 3.6s;opacity:0}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.row{animation:none;opacity:1}.cursor{animation:none}}
</style>
<defs><clipPath id="card"><rect width="900" height="300" rx="18"/></clipPath></defs>
<g clip-path="url(#card)">
<rect width="900" height="300" rx="18" fill="#FBF8FA"/>
<rect x="0" y="0" width="900" height="6" fill="#714B67"/>
<rect x="0" y="0" width="300" height="6" fill="#C98A12"/>
<text x="56" y="78" class="sans" font-size="40" font-weight="700" fill="#241C26">Guillermo Rojo</text>
<text x="56" y="110" class="sans" font-size="18" fill="#6B5D6A">Senior Odoo Engineer · Full-Stack Developer · systems that run in production</text>
<line x1="56" y1="136" x2="844" y2="136" stroke="#E3DAE2" stroke-width="1"/>
<rect x="40" y="150" width="820" height="128" rx="10" fill="#F2ECF1"/>
<g class="row" style="animation-delay:0.5s"><text x="56" y="176" class="mono" fill="#714B67" font-weight="700">plan    </text><text x="160" y="176" class="mono" fill="#241C26">12.0  ▸  13.0  ▸  14.0  ▸  15.0  ▸  16.0  ▸  17.0  ▸  18.0</text></g>
<g class="row" style="animation-delay:1.2s"><text x="56" y="206" class="mono" fill="#714B67" font-weight="700">preview </text><text x="160" y="206" class="mono" fill="#241C26">every command, before anything runs</text></g>
<g class="row" style="animation-delay:1.9s"><text x="56" y="236" class="mono" fill="#714B67" font-weight="700">confirm </text><text x="160" y="236" class="mono" fill="#241C26">typed, for whatever cannot be undone</text></g>
<g class="row" style="animation-delay:2.6s"><text x="56" y="266" class="mono" fill="#714B67" font-weight="700">apply   </text><text x="160" y="266" class="mono" fill="#241C26">then checked against the real thing<tspan fill="#2F8A57" font-weight="700">  ✓</tspan></text></g>
<rect class="cursor" x="452" y="263" width="9" height="17" fill="#C98A12"/>
</g>
</svg>
