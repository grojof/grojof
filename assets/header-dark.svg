<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Guillermo Rojo — Senior Odoo Engineer · Full-Stack Developer. Plan, preview, confirm, apply: 12.0 to 18.0.">
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:15px}
.row{opacity:0;animation:in .6s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.step{opacity:.22;animation:lit 9.0s ease-in-out infinite}
@keyframes lit{0%{opacity:.22}5%{opacity:1}70%{opacity:1}82%{opacity:.22}100%{opacity:.22}}
.done{opacity:0;animation:pop 9.0s ease-out infinite;animation-delay:4.30s}
@keyframes pop{0%{opacity:0}4%{opacity:1}48%{opacity:1}56%{opacity:0}100%{opacity:0}}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.row,.step,.done,.cursor{animation:none;opacity:1}}
</style>
<defs><clipPath id="card"><rect width="900" height="300" rx="18"/></clipPath></defs>
<g clip-path="url(#card)">
<rect width="900" height="300" fill="#14111A"/>
<rect x="0" y="0" width="900" height="6" fill="#C08AB4"/>
<rect x="0" y="0" width="300" height="6" fill="#E8B04B"/>
<text x="56" y="78" class="sans" font-size="40" font-weight="700" fill="#EDE6EE">Guillermo Rojo</text>
<text x="56" y="110" class="sans" font-size="18" fill="#A99BAA">Senior Odoo Engineer · Full-Stack Developer · systems that run in production</text>
<line x1="56" y1="136" x2="844" y2="136" stroke="#2E2634" stroke-width="1"/>
<rect x="40" y="150" width="820" height="128" rx="10" fill="#1D1824"/>
<text x="56" y="176" class="mono" fill="#C08AB4" font-weight="700">plan</text>
<text x="160" y="176" class="mono step" fill="#EDE6EE" style="animation-delay:1.00s">12.0</text>
<text x="207" y="176" class="mono step" fill="#C08AB4" style="animation-delay:1.22s">▸</text>
<text x="234" y="176" class="mono step" fill="#EDE6EE" style="animation-delay:1.45s">13.0</text>
<text x="281" y="176" class="mono step" fill="#C08AB4" style="animation-delay:1.67s">▸</text>
<text x="308" y="176" class="mono step" fill="#EDE6EE" style="animation-delay:1.90s">14.0</text>
<text x="355" y="176" class="mono step" fill="#C08AB4" style="animation-delay:2.12s">▸</text>
<text x="382" y="176" class="mono step" fill="#EDE6EE" style="animation-delay:2.35s">15.0</text>
<text x="429" y="176" class="mono step" fill="#C08AB4" style="animation-delay:2.57s">▸</text>
<text x="456" y="176" class="mono step" fill="#EDE6EE" style="animation-delay:2.80s">16.0</text>
<text x="503" y="176" class="mono step" fill="#C08AB4" style="animation-delay:3.02s">▸</text>
<text x="530" y="176" class="mono step" fill="#EDE6EE" style="animation-delay:3.25s">17.0</text>
<text x="577" y="176" class="mono step" fill="#C08AB4" style="animation-delay:3.47s">▸</text>
<text x="604" y="176" class="mono step" fill="#E8B04B" style="animation-delay:3.70s">18.0</text>
<text x="656" y="176" class="mono done" fill="#7BC59A" font-weight="700">✓</text>
<g class="row" style="animation-delay:0.30s"><text x="56" y="206" class="mono" fill="#C08AB4" font-weight="700">preview</text><text x="160" y="206" class="mono" fill="#EDE6EE">every command, before anything runs</text></g>
<g class="row" style="animation-delay:0.55s"><text x="56" y="236" class="mono" fill="#C08AB4" font-weight="700">confirm</text><text x="160" y="236" class="mono" fill="#EDE6EE">typed, for whatever cannot be undone</text></g>
<g class="row" style="animation-delay:0.80s"><text x="56" y="266" class="mono" fill="#C08AB4" font-weight="700">apply</text><text x="160" y="266" class="mono" fill="#EDE6EE">then checked against the real thing</text></g>
<rect class="cursor" x="676" y="163" width="8" height="15" fill="#E8B04B"/>
</g>
</svg>
